name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS / Node 20
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Bootstrap locked Python environment
        run: node tests/packaging/bootstrap-client.mjs

      - name: Run deterministic test suite
        run: npm test

      - name: Verify clean-copy installation
        run: npm run test:clean-install

      - name: Audit production dependencies
        run: npm audit --omit=dev
